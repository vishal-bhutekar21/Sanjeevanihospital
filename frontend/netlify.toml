# ==============================================================================
# Netlify Configuration - Sanjeevani Frontend
# Frontend Subdirectory Configuration (when Netlify root is set to 'frontend')
# ==============================================================================

[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Single-Page Application (SPA) Routing Rule
# Redirects all incoming traffic to index.html with HTTP 200 for client-side routing (React Router DOM)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache-Control headers for hashed static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Global Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
