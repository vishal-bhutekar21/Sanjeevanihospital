name: "Worker: deploy API to Cloudflare"

# Deploys worker/ (the hospital API) to Cloudflare Workers + D1 on every
# merge to main that touches it. Setup: documentation/09-cloudflare.md
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/worker-deploy.yml"
  workflow_dispatch:

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check repository secrets
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Add these GitHub repository secrets first:$missing (see documentation/09-cloudflare.md)"
            exit 1
          fi
          if [ -z "$JWT_SECRET" ]; then
            echo "::notice::JWT_SECRET is not a GitHub secret; the Worker keeps the value already set in Cloudflare."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci
      - run: npm run typecheck

      - name: Find or create the D1 database
        run: ./scripts/ensure-d1.sh

      - name: Apply database migrations
        run: npx wrangler d1 migrations apply sanjeevani-db --remote

      - name: Deploy
        id: deploy
        run: |
          npx wrangler deploy | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Set secrets on the Worker
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          MSG91_AUTH_KEY: ${{ secrets.MSG91_AUTH_KEY }}
          MSG91_TEMPLATE_ID: ${{ secrets.MSG91_TEMPLATE_ID }}
        run: |
          node -e '
            const keys = ["JWT_SECRET","RAZORPAY_KEY_ID","RAZORPAY_KEY_SECRET","MSG91_AUTH_KEY","MSG91_TEMPLATE_ID"];
            const out = Object.fromEntries(keys.filter((k) => process.env[k]).map((k) => [k, process.env[k]]));
            require("fs").writeFileSync(process.env.RUNNER_TEMP + "/secrets.json", JSON.stringify(out));
            console.log("Setting:", Object.keys(out).join(", "));
          '
          if [ "$(cat "$RUNNER_TEMP/secrets.json")" != "{}" ]; then npx wrangler secret bulk "$RUNNER_TEMP/secrets.json"; fi
          rm -f "$RUNNER_TEMP/secrets.json"

      - name: Check the API answers
        run: |
          url="${{ steps.deploy.outputs.url }}"
          if [ -n "$url" ]; then
            sleep 5
            curl -fsS "$url/api/health" && echo
            {
              echo "### API deployed"
              echo ""
              echo "Health check: $url/api/health"
              echo ""
              echo "Website setting: \`apiBaseUrl: '$url/api'\` in frontend/src/config/hospital.ts (or VITE_API_URL on Netlify)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
